<div class="page-container">
  <!-- Background Elements -->
  <div class="background-pattern"></div>
  <div class="floating-elements">
    <div class="floating-element fork"></div>
    <div class="floating-element knife"></div>
    <div class="floating-element plate"></div>
    <div class="floating-element glass"></div>
  </div>
  
  <div class="content-wrapper">
    <header class="page-header">
      <div class="header-content">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
          </svg>
        </div>
        <h1>Smart Menu Creator</h1>
        <p class="header-subtitle">Elevate your dining experience with intelligent menu management</p>
      </div>
    </header>

    <!-- Loading State -->
    <div *ngIf="isLoading()" class="loading-state">
      <div class="loading-spinner"></div>
      <p>Loading your delicious items...</p>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading() && items().length === 0" class="empty-state">
      <div class="empty-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-6-6h12" />
        </svg>
      </div>
      <h2>Your menu is waiting</h2>
      <p>Start crafting your perfect menu with our AI-powered tools</p>
      <button class="btn btn-primary" (click)="goToAddItem()">Create Your First Dish</button>
    </div>

    <!-- Menu Items Grid -->
    <div class="menu-grid" *ngIf="!isLoading() && items().length > 0">
      <div class="item-card" *ngFor="let item of items()">
        <div class="item-image-container">
          <div class="image-overlay"></div>
          <img
            [src]="item.imageUrl || 'assets/placeholder-food.jpg'"
            [alt]="item.title"
            referrerpolicy="no-referrer"
            
            class="item-image"
          >
          <div class="item-badge" *ngIf="item.imageType === 'ai'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />
            </svg>
            AI Generated
          </div>
        </div>

        <div class="item-content">
          <div class="item-header">
            <h3>{{ item.title }}</h3>
            <div class="item-price">${{ item.price.toFixed(2) }}</div>
          </div>
          
          <p class="description">{{ item.description }}</p>

          <div class="item-actions">
            <button class="btn-delete" (click)="deleteItem(item._id)">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
              </svg>
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" (click)="goToAddItem()" aria-label="Add new item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    </button>
  </div>
</div>
